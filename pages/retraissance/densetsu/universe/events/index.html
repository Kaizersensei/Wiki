<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Events &amp; Timeline</title>
  <link rel="stylesheet" href="../../../assets/site.css" />
</head>
<body class="theme-wiki">
  <header class="site-header">
                <div class="brand">
      <a href="../../../index.html" aria-label="Retraissance">
        <img class="nav-logo" src="../../../assets/res/LOGO_Retraissance.gif" alt="Retraissance" />
      </a>
    </div>
                    <nav class="nav-links">
      <a class="nav-home" href="../../../index.html">Retraissance</a>
      <a href="../../../team/index.html">Team</a>
      <div class="nav-dropdown">
        <span class="nav-dropdown-toggle">Projects ▾</span>
        <div class="nav-dropdown-menu">
          <a href="../../../projects/index.html">Projects Index</a>
          <a href="../../../densetsu/index.html">Densetsu</a>
        </div>
      </div>
      <div class="nav-dropdown">
        <span class="nav-dropdown-toggle">Densetsu ▾</span>
        <div class="nav-dropdown-menu">
          <a href="../../../densetsu/universe/index.html">Universe</a>
          <a href="../../../densetsu/engine/index.html">Engine</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="content">
    <section class="panel">
      <p class="eyebrow">universe</p>
      <h1>Events &amp; Timeline</h1>
      <p>Search, sort, filter, and group events.</p>

      <div class="filters">
        <label for="e-search">Search</label>
        <input id="e-search" type="search" placeholder="Search events." />

        <label for="e-filter">Filter tag</label>
        <select id="e-filter"><option value="all">All</option></select>

        <label for="e-sort">Sort</label>
        <select id="e-sort">
          <option value="name">Name (A-Z)</option>
          <option value="name-desc">Name (Z-A)</option>
          <option value="tag">Tag</option>
        </select>

        <label for="e-group">Group by</label>
        <select id="e-group">
          <option value="none">None</option>
          <option value="tag">Tag</option>
        </select>
      </div>

      <div id="e-list" class="link-list"></div>

      <div class="callout">
        <strong>Missing:</strong> Event catalog is sparse; add more beats/arcs and tag them by age/region.
      </div>
    </section>
  </main>

  <script>
    const eData = [
      { name: 'Hirogawa Town Fire', href: 'hirogawa_town_fire.html', tag: 'event' },
      { name: 'Timeline Arcs', href: 'timeline_arcs.html', tag: 'timeline' },
      { name: 'Timeline Index', href: 'timeline_index.html', tag: 'timeline' }
    ];

    const eSearch = document.getElementById('e-search');
    const eFilter = document.getElementById('e-filter');
    const eSort = document.getElementById('e-sort');
    const eGroup = document.getElementById('e-group');
    const eList = document.getElementById('e-list');

    const buildEFilter = () => {
      const values = Array.from(new Set(eData.map(d => d.tag).filter(Boolean))).sort();
      eFilter.innerHTML = '<option value="all">All</option>' + values.map(v => `<option value="${v}">${v}</option>`).join('');
    };

    const renderE = () => {
      const q = (eSearch.value || '').toLowerCase();
      const flt = eFilter.value;
      let items = eData.filter(d => d.name.toLowerCase().includes(q) || (d.tag || '').toLowerCase().includes(q));
      if (flt !== 'all') items = items.filter(d => d.tag === flt);

      const sorter = key => (a, b) => (a[key] || '').localeCompare(b[key] || '');
      if (eSort.value === 'name') items.sort(sorter('name'));
      else if (eSort.value === 'name-desc') items.sort((a, b) => (b.name || '').localeCompare(a.name || ''));
      else if (eSort.value === 'tag') items.sort(sorter('tag'));

      const renderItem = d => `<li><a href="${d.href}">${d.name}</a>${d.tag ? `<span class="meta-chip">${d.tag}</span>` : ''}</li>`;

      if (eGroup.value === 'tag') {
        const grouped = {};
        items.forEach(d => {
          const k = d.tag || 'Unspecified';
          (grouped[k] = grouped[k] || []).push(d);
        });
        const html = Object.keys(grouped).sort().map(k => `<h3>${k}</h3><ul class="link-list">${grouped[k].map(renderItem).join('')}</ul>`).join('');
        eList.innerHTML = html || '<p>No matches.</p>';
      } else {
        eList.innerHTML = '<ul class="link-list">' + (items.map(renderItem).join('') || '<li>No matches.</li>') + '</ul>';
      }
    };

    eSearch.addEventListener('input', renderE);
    eFilter.addEventListener('change', renderE);
    eSort.addEventListener('change', renderE);
    eGroup.addEventListener('change', renderE);
    buildEFilter();
    renderE();
  </script>
  <script src="../../../assets/site.js" defer></script>
</body>
</html>
