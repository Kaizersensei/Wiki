    const lxSearch = document.getElementById('lx-search');
    const lxFilter = document.getElementById('lx-filter');
    const lxSort = document.getElementById('lx-sort');
    const lxList = document.getElementById('lx-list');

    const buildFilter = () => {
      const values = Array.from(new Set(lxData.map(d => d.Category).filter(Boolean))).sort();
      lxFilter.innerHTML = '<option value="all">All</option>' + values.map(v => `<option value="${v}">${v}</option>`).join('');
    };

    const render = () => {
      const q = (lxSearch.value || '').toLowerCase();
      const flt = lxFilter.value;
      let items = lxData.filter(d => d.Name.toLowerCase().includes(q) || d.Category.toLowerCase().includes(q));
      if (flt !== 'all') items = items.filter(d => d.Category === flt);

      const sorter = key => (a, b) => (a[key] || '').localeCompare(b[key] || '');
      if (lxSort.value === 'name') items.sort(sorter('Name'));
      else if (lxSort.value === 'name-desc') items.sort((a, b) => (b.Name || '').localeCompare(a.Name || ''));
      else if (lxSort.value === 'category') items.sort(sorter('Category'));

      const renderItem = d => `<li><a href="${d.Href}">${d.Name}</a><span class="meta-chip">${d.Category}</span></li>`;

      const grouped = {};
      items.forEach(d => {
        const letter = (d.Name || '').charAt(0).toUpperCase() || '#';
        (grouped[letter] = grouped[letter] || []).push(d);
      });
      const html = Object.keys(grouped).sort().map(k => `<h3>${k}</h3><ul class="link-list">${grouped[k].map(renderItem).join('')}</ul>`).join('');
      lxList.innerHTML = html || '<p>No matches.</p>';
    };

    lxSearch.addEventListener('input', render);
    lxFilter.addEventListener('change', render);
    lxSort.addEventListener('change', render);
    buildFilter();
    render();
