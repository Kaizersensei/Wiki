<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Software</title>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body class="theme-wiki">
  <header class="site-header">
    <div class="brand">
      <a href="../index.html" aria-label="Retraissance">
        <img class="nav-logo" src="/pages/retraissance/assets/res/LOGO_Retraissance.gif" alt="Retraissance">
      </a>
    </div>
    <nav class="nav-links"></nav>
  </header>

  <main class="content">
    <section class="panel">
      <p class="eyebrow">software</p>
      <h1>Software</h1>
      <p>Internal/custom software downloads and documentation.</p>

      <section aria-labelledby="tools-heading">
        <h2 id="tools-heading">Tools</h2>
        <p>Web apps and utilities for creating and managing projects.</p>

        <div class="filters">
          <label for="tl-search">Search</label>
          <input id="tl-search" type="search" placeholder="Search tools">

          <label for="tl-tag">Filter tag</label>
          <select id="tl-tag"><option value="all">All</option></select>

          <label for="tl-sort">Sort</label>
          <select id="tl-sort">
            <option value="name">Name (A-Z)</option>
            <option value="name-desc">Name (Z-A)</option>
          </select>
        </div>

        <div id="tl-list" class="link-list"></div>


      </section>
    </section>
  </main>

  <script id="tools-data-json" type="application/json">
[
  {
    "name": "InfiniBoard",
    "href": "tools/infiniboard/index.html",
    "description": "Compose images, text, and mockups on an infinite canvas.",
    "tags": [
      "whiteboard",
      "design"
    ],
    "guide": "tools/infiniboard.html"
  },
  {
    "name": "InPoster",
    "href": "tools/inposter/index.html",
    "description": "Compose and preview social posts with image attachments and local history.",
    "tags": [
      "writing",
      "social media",
      "local"
    ],
    "guide": "tools/inposter.html"
  },
  {
    "name": "LineArt Studio",
    "href": "tools/lineart-studio/index.html",
    "description": "Turn images into line art with edge detection and adjustable filters.",
    "tags": [
      "images",
      "line art"
    ],
    "guide": "tools/lineart-studio.html"
  },
  {
    "name": "T-Ex (TeXtract)",
    "href": "tools/textract/index.html",
    "description": "Extract and straighten textures, generate PBR maps, and upscale locally.",
    "tags": [
      "textures",
      "images"
    ],
    "guide": "tools/textract.html"
  },
  {
    "name": "UnwrApp3D",
    "href": "tools/unwrapp3d/index.html",
    "description": "Paint 3D models, unwrap UVs, and export textures.",
    "tags": [
      "3D",
      "painting"
    ],
    "guide": "tools/unwrapp3d.html"
  },
  {
    "name": "Example Tool",
    "href": "../tools/example_tool.html",
    "description": "Example command-line tool documentation.",
    "tags": [
      "cli",
      "example"
    ]
  }
]
  </script>

  <script>
    const dataEl = document.getElementById('tools-data-json');
    const initialData = (() => {
      if (dataEl) {
        try { return JSON.parse(dataEl.textContent || '[]'); } catch (e) { return []; }
      }
      return [];
    })();
    const tlData = (initialData.length ? initialData : []).map(d => {
      const baseTags = Array.from(new Set(d.tags || []));
      return { ...d, baseTags, tags: baseTags.slice(), name: d.name || '', href: d.href || '' };
    });

    const tlSearch = document.getElementById('tl-search');
    const tlTag = document.getElementById('tl-tag');
    const tlSort = document.getElementById('tl-sort');
    const tlList = document.getElementById('tl-list');

    const buildFilter = () => {
      const tagValues = Array.from(new Set(tlData.flatMap(d => d.tags || []))).sort();
      tlTag.innerHTML = '<option value="all">All</option>' + tagValues.map(v => `<option value="${v}">${v}</option>`).join('');
    };

    const normalizeHref = (href) => {
      if (!href) return '#';
      if (/^https?:/i.test(href)) return href;
      const clean = href.replace(/^\/+/, '');
      return clean;
    };

    const render = () => {
      const q = (tlSearch.value || '').toLowerCase();
      const tag = tlTag.value;
      let items = tlData.filter(d => `${d.name} ${d.description || ''}`.toLowerCase().includes(q));
      if (tag !== 'all') items = items.filter(d => (d.tags || []).includes(tag));

      if (tlSort.value === 'name') items.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      else items.sort((a, b) => (b.name || '').localeCompare(a.name || ''));

      const html = items.length
        ? '<ul class="link-list">' + items.map(d => `<li><a href="${normalizeHref(d.href)}">${d.name}</a>${(d.tags||[]).map(t => `<span class="meta-chip">${t}</span>`).join('')}${d.description ? `<p>${d.description}</p>` : ''}${d.guide ? `<a href="${d.guide}">Guide</a>` : ''}</li>`).join('') + '</ul>'
        : '<p>No tools match your search.</p>';
      tlList.innerHTML = html;
    };

    tlSearch.addEventListener('input', render);
    tlTag.addEventListener('change', render);
    tlSort.addEventListener('change', render);
    buildFilter();
    render();
  </script>
  <script src="../assets/site.js" defer></script>
</body>
</html>
